name: Reference media regression

on:
  pull_request:
    branches:
      - master
    paths:
      - "src/Media/**"
      - "src/Providers/rtaime.Provider.VirtualMedia/**"
      - "src/Hosts/rtaime.RuntimeHost/**"
      - "tests/rtaime.Tests.Integration/ReferenceMedia*"
      - "tests/rtaime.Tests.Integration/LocalMediaContainerProbeTests.cs"
      - "tests/rtaime.Tests.Integration/MultiDeck*"
      - "build/testmedia/**"
      - "build/qualification/*SsdPlayback*"
      - "qualification/soak/ssd-playback.json"
      - "docs/ReferenceMediaRegression.md"
      - ".github/workflows/reference-media-regression.yml"
  workflow_dispatch:
    inputs:
      playback_minutes:
        description: "Real local-file baseline duration (60 minutes is opt-in)"
        type: choice
        options: ["10", "60"]
        default: "10"

env:
  RTAIME_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
  RTAIME_BASELINE_SDK: "10.0.401"

permissions:
  contents: read

concurrency:
  group: reference-media-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-playback-allocation-diagnostic:
    name: Local playback allocation diagnostic
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      RTAIME_LOCAL_ALLOCATION_DIAGNOSTICS: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build diagnostic integration graph
        run: dotnet build tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release
      - name: Collect short sampled allocation evidence
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~ReferenceMediaPlaybackAllocationDiagnosticsTests|FullyQualifiedName~ProfessionalRecordingMp4IntegrationTests.Segment_writers_reuse_exact_NV12_extent" --logger "console;verbosity=detailed"

  reference-media:
    name: Local container and codec reference matrix
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install pinned FFmpeg test encoder
        shell: pwsh
        run: ./build/testmedia/Install-ReferenceMediaEncoder.ps1

      - name: Restore
        run: dotnet restore rtaime.slnx

      - name: Build integration graph
        run: dotnet build tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-restore

      - name: Qualify worker ownership and admission isolation
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~MultiDeckLocalMediaIntegrationTests|FullyQualifiedName~LocalMediaContainerProbeTests|FullyQualifiedName~LocalMediaDecoderSafetyTests|FullyQualifiedName~AsynchronousLocalMediaDecodeTests" --logger "console;verbosity=detailed"

      - name: Generate and run reference media regressions
        shell: pwsh
        run: ./build/testmedia/Test-ReferenceMediaRegression.ps1

      - name: Upload reference manifests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-reference-media-manifests-${{ github.run_id }}
          path: artifacts/testmedia/reference-regression/*.json
          if-no-files-found: error

  mxf-op1a:
    name: Independent 50 and 59.94 MXF qualification
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install pinned FFprobe
        shell: pwsh
        run: ./build/testmedia/Install-ReferenceMediaEncoder.ps1

      - name: Obtain and SHA256 verify pinned BMX release
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "bmx-win64-binary-1.6.zip"
          Invoke-WebRequest -Uri "https://github.com/bbc/bmx/releases/download/v1.6/bmx-win64-binary-1.6.zip" -OutFile $archive
          $actual = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "BMX v1.6 artifact SHA256: $actual"
          $expected = "e36096e8a02a5a767e27a4c9794b03f11dbd7af3ccd9679104489b89dca4f9ce"
          if ($actual -ne $expected) { throw "Pinned BMX v1.6 archive SHA256 mismatch." }
          $unpacked = Join-Path $env:RUNNER_TEMP "rtaime-bmx"
          Expand-Archive -Path $archive -DestinationPath $unpacked -Force
          $candidates = @(Get-ChildItem -Path $unpacked -Recurse -File -Filter raw2bmx.exe)
          if ($candidates.Count -ne 1) { throw "BMX raw2bmx.exe was not found exactly once." }
          $bin = $candidates[0].FullName
          & $bin --version
          if ($LASTEXITCODE -ne 0) { throw "BMX executable preflight failed." }
          "RTAIME_RAW2BMX=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $ffprobe = (Get-Command ffprobe -ErrorAction Stop).Source
          "RTAIME_FFPROBE=$ffprobe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RTAIME_MXF_QUALIFICATION=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        run: dotnet restore rtaime.slnx

      - name: Build MXF integration project
        run: dotnet build tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-restore

      - name: Record and independently probe 1080p50 and 1080p59.94
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~BmxOp1aRecordingIntegrationTests"


  local-playback-baseline:
    name: Local MP4 long playback baseline
    runs-on: windows-latest
    timeout-minutes: 150
    env:
      RTAIME_REFERENCE_MEDIA_REGRESSION: "1"
      RTAIME_REFERENCE_MEDIA_OUTPUT: ${{ github.workspace }}/artifacts/testmedia/local-playback
      RTAIME_LOCAL_PLAYBACK_MINUTES: ${{ inputs.playback_minutes || '10' }}
      RTAIME_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      RTAIME_BASELINE_SDK: "10.0.401"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install pinned test encoder
        shell: pwsh
        run: ./build/testmedia/Install-ReferenceMediaEncoder.ps1
      - name: Canonical Release build
        shell: pwsh
        run: ./build/development/Invoke-DeveloperBuild.ps1 -Configuration Release
      - name: Real playback and local fault baseline
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~ReferenceMediaPlaybackBaselineTests" --logger "console;verbosity=detailed"
      - name: Require actual source-bound playback evidence
        shell: pwsh
        run: ./build/testmedia/Test-LocalPlaybackEvidence.ps1 -Path "$env:RTAIME_REFERENCE_MEDIA_OUTPUT/local-playback-baseline.json" -SourceCommit $env:RTAIME_SOURCE_COMMIT -Minutes $env:RTAIME_LOCAL_PLAYBACK_MINUTES
      - name: Preserve bounded reports, never decoded media
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-local-playback-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/testmedia/local-playback/*.json
          if-no-files-found: error

  ssd-playback:
    name: Staged dual-deck ten-minute playback (${{ matrix.format }})
    strategy:
      fail-fast: false
      matrix:
        format: ["1080p50", "1080p59.94"]
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Install existing pinned reference encoder
        shell: pwsh
        run: ./build/testmedia/Install-ReferenceMediaEncoder.ps1
      - name: Canonical Release build
        shell: pwsh
        run: ./build/development/Invoke-DeveloperBuild.ps1 -Configuration Release
      - name: Real dual-deck duration and controlled fault prerequisites
        shell: pwsh
        env:
          RTAIME_SELECTED_FORMAT: ${{ matrix.format }}
        run: ./build/qualification/Invoke-SsdPlaybackQualification.ps1 -Profile 10m -Format $env:RTAIME_SELECTED_FORMAT -NoBuild
      - name: Retain bounded SSD observations without media redistribution
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-ssd-playback-${{ matrix.format }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/qualification/ssd-playback/**/*.json
            artifacts/qualification/ssd-playback/**/*.trx
          if-no-files-found: error
