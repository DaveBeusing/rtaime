# Copyright (c) Dave Beusing <david.beusing@gmail.com>.

name: Required gates

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

env:
  RTAIME_PR_NUMBER: ${{ github.event.pull_request.number || '' }}
  RTAIME_VALIDATION_SEQUENCE: ${{ github.run_id }}.${{ github.run_attempt }}
  RTAIME_BUILD_ID: validation-${{ github.run_id }}-${{ github.run_attempt }}

concurrency:
  group: required-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Qualify SDK
        shell: pwsh
        run: |
          dotnet --info
          if ((dotnet --version) -ne "10.0.401") {
            throw "Expected .NET SDK 10.0.401."
          }

      - name: Restore
        run: dotnet restore rtaime.slnx

      - name: Build
        shell: pwsh
        run: ./build/development/Invoke-DeveloperBuild.ps1 -Configuration Release

      - name: Output canvas geometry persistence and transport regressions
        shell: pwsh
        run: |
          dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~OutputCanvasModelTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Canvas geometry regression failed." }
          dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~Canvas_|FullyQualifiedName~Killed_ControlHost_restores_durable_authority" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Canvas persistence/transport regression failed." }

      - name: HD output compatibility and UHD admission boundaries
        shell: pwsh
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~HighResolutionOutputAdmissionTests" --logger "console;verbosity=detailed"

      - name: GPU transfer ownership and surface compatibility regressions
        shell: pwsh
        run: |
          dotnet test tests/rtaime.Tests.Contracts/rtaime.Tests.Contracts.csproj --configuration Release --no-build --filter "FullyQualifiedName~BackendAgnosticResourceContractTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Backend-neutral surface contract regression failed." }
          dotnet test tests/rtaime.Tests.Architecture/rtaime.Tests.Architecture.csproj --configuration Release --no-build --filter "FullyQualifiedName~BackendNeutralResourceArchitectureTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Backend-neutral resource architecture regression failed." }
          dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~GpuMemoryTransferOptimizationTests|FullyQualifiedName~GpuReadbackOwnershipConcurrencyTests|FullyQualifiedName~GpuSchedulingSynchronizationTests|FullyQualifiedName~GpuLifecycleRecoveryTests|FullyQualifiedName~GpuBackendResourceSemanticsTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "GPU transfer and ownership regression failed." }

      - name: Resident next preparation and authoritative handoff regressions
        shell: pwsh
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~PreparedMediaHandoffIntegrationTests|FullyQualifiedName~MediaAssetCatalogIntegrationTests.Prepared_execution_revision_lease" --logger "console;verbosity=detailed"

      - name: File deck capacity ownership and Program isolation regressions
        shell: pwsh
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~MultiDeckLocalMediaIntegrationTests|FullyQualifiedName~AsynchronousLocalMediaDecodeTests|FullyQualifiedName~MediaAssetPreflightIntegrationTests" --logger "console;verbosity=detailed"

      - name: Local input capability and rejection regressions
        shell: pwsh
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~LocalMediaContainerProbeTests" --logger "console;verbosity=detailed"

      - name: Asset preflight contracts ownership transport and operator regressions
        shell: pwsh
        run: |
          dotnet test tests/rtaime.Tests.Contracts/rtaime.Tests.Contracts.csproj --configuration Release --no-build --filter "FullyQualifiedName~MediaAssetPreflightContractTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Preflight contract regression failed." }
          dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~MediaAssetPreflightIntegrationTests|FullyQualifiedName~MediaAssetCatalogIntegrationTests.Same_path_relink|FullyQualifiedName~ExternalControlIntegrationTests.Catalogue_preflight_|FullyQualifiedName~ExternalControlIntegrationTests.Observer_cannot_admit" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Preflight ownership/transport regression failed." }
          dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~MediaAssetPreparationOperatorTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Preflight Operator regression failed." }

      - name: SSD read histogram and fail-closed evidence regressions
        shell: pwsh
        run: |
          dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~LocalMediaPlaybackMeasurementsTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Read histogram regression failed." }
          ./build/qualification/Test-SsdPlaybackVerifierRegression.ps1
          ./build/qualification/Test-SsdPlaybackEnvironmentRegression.ps1

      - name: Qualify atomic journal batching before lifecycle load
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~ProductionJournalBatchIntegrationTests|FullyQualifiedName~DurablePersistenceIntegrationTests" --logger "console;verbosity=detailed"

      - name: Attribute fifty fixed rapid TAKE shutdown cases before broad suites
        env:
          RTAIME_RAPID_TAKE_REPETITIONS: "50"
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~ProductionIpcIntegrationTests.Serialized_operator_preview_takes_remain_authoritative_under_rapid_actions" --logger "console;verbosity=detailed"

      - name: Qualify asynchronous local media admission before broad suites
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~MultiDeckLocalMediaIntegrationTests|FullyQualifiedName~LocalMediaContainerProbeTests|FullyQualifiedName~LocalMediaDecoderSafetyTests|FullyQualifiedName~AsynchronousLocalMediaDecodeTests|FullyQualifiedName~LocalMediaRuntimeIntegrationTests|FullyQualifiedName~LocalMediaTransportIntegrationTests|FullyQualifiedName~MediaAutoplayEndBehaviorIntegrationTests|FullyQualifiedName~ProfessionalRecordingMp4IntegrationTests.Segment_writers_reuse_exact_NV12_extent" --logger "console;verbosity=detailed"


      - name: Startup atomic evidence publication regressions
        run: dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~ApplicationEvidencePublicationTests|FullyQualifiedName~UnifiedApplicationHostTests.Evidence_publication_failure" --logger "console;verbosity=detailed"

      - name: Show preflight, action history and notification regressions
        shell: pwsh
        run: |
          dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~ShowPreflightAndActionHistoryTests|FullyQualifiedName~OperatorNotificationTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Show preflight and action history regressions failed." }
          dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~ShowReadinessOperatorTests" --logger "console;verbosity=detailed"
          if ($LASTEXITCODE -ne 0) { throw "Show checks Operator regressions failed." }

      - name: Command palette authority and shortcut profile regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~OperatorShortcutProfileTests|FullyQualifiedName~OperatorCommandPaletteTests|FullyQualifiedName~OperatorLibraryTests" --logger "console;verbosity=detailed"

      - name: Media Library metadata, preferences and hover isolation regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~MediaLibraryBrowsingTests|FullyQualifiedName~MediaSmartSearchBatchTests|FullyQualifiedName~ProductionMacroOperatorTests.Cancelled_status_refresh" --logger "console;verbosity=detailed"

      - name: Timeline ergonomics and authoring history regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter FullyQualifiedName~TimelineErgonomicsTests --logger "console;verbosity=detailed"
      - name: Precision Inspector and draft authority regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~InspectorPrecisionTests|FullyQualifiedName~InspectorDraftTransactionTests" --logger "console;verbosity=detailed"
      - name: Dock workspace model and restore regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~OperatorDockLayoutTests|FullyQualifiedName~WorkspacePresentationTemplateTests" --logger "console;verbosity=detailed"

      - name: Release readiness correlation regressions
        shell: pwsh
        run: ./build/release/Test-ReleaseReadinessRegression.ps1

      - name: Bounded soak summary regressions
        run: dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~BoundedSoakEvidenceTests" --logger "console;verbosity=detailed"

      - name: Soak evidence verifier negative regressions
        shell: pwsh
        run: ./build/qualification/Test-SustainedMixedLoadVerifierRegression.ps1

      - name: Staged mixed-load software smoke
        shell: pwsh
        run: ./build/qualification/Invoke-SustainedMixedLoadQualification.ps1 -Profile smoke -NoBuild

      - name: Renderer workload cycle software regressions
        run: dotnet test tests/rtaime.Tests.Performance/rtaime.Tests.Performance.csproj --configuration Release --no-build --filter "FullyQualifiedName~RendererReferenceHardwareQualificationTests.Renderer_workload_cycles_and_pressure" --logger "console;verbosity=detailed"

      - name: Preserve bounded mixed-load software evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-mixed-soak-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qualification/mixed-soak
          if-no-files-found: error

      - name: Lifecycle GPU fault qualification
        run: dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~GpuLifecycleRecoveryTests|FullyQualifiedName~GpuBackendResourceSemanticsTests" --logger "console;verbosity=detailed"

      - name: Lifecycle IPC fault and resource baseline qualification
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~ControlTransportFaultQualificationTests|FullyQualifiedName~HostIpcSessionLifecycleIntegrationTests|FullyQualifiedName~OperatorMonitoringPlaneTests" --logger "console;verbosity=detailed"

      - name: Consumer timing and shutdown regression qualification
        run: dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~ReplayCaptureIsolationTests|FullyQualifiedName~NetworkOutputFoundationTests|FullyQualifiedName~RecordingFoundationTests" --logger "console;verbosity=detailed"

      - name: Mixed Runtime consumer isolation qualification
        env:
          RTAIME_PIPELINE_BASELINE_EVIDENCE: ${{ github.workspace }}/artifacts/qualification/program-pipeline
          RTAIME_BASELINE_SDK: "10.0.401"
          RTAIME_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RTAIME_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~RuntimeConsumerIsolationTests" --logger "console;verbosity=detailed"

      - name: Renderer low latency pixel and ownership qualification
        run: dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~GpuCompositorOptimizationTests|FullyQualifiedName~GpuProcessingTests|FullyQualifiedName~GpuLifecycleRecoveryTests|FullyQualifiedName~GpuSchedulingSynchronizationTests|FullyQualifiedName~GpuReadbackOwnershipConcurrencyTests" --logger "console;verbosity=detailed"

      - name: Renderer scalar fallback parity qualification
        env:
          DOTNET_EnableHWIntrinsic: "0"
        run: dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~GpuCompositorOptimizationTests.Dissolve_matches_independent_integer_equation|FullyQualifiedName~GpuCompositorOptimizationTests.Vector_dissolve_preserves_scalar_tail" --logger "console;verbosity=detailed"

      - name: Program pipeline bounded telemetry qualification
        run: dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~TimingQualificationTests" --logger "console;verbosity=detailed"

      - name: Renderer comparable low latency software profile
        env:
          RTAIME_PIPELINE_BASELINE_EVIDENCE: ${{ github.workspace }}/artifacts/qualification/program-pipeline
          RTAIME_BASELINE_SDK: "10.0.401"
          RTAIME_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RTAIME_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: dotnet test tests/rtaime.Tests.Performance/rtaime.Tests.Performance.csproj --configuration Release --no-build --filter "FullyQualifiedName~GpuCompositorPerformanceProfileTests|FullyQualifiedName~ProgramPipelineMeasurementBaselineTests|FullyQualifiedName~RuntimePerformanceStatusBarPerformanceTests" --logger "console;verbosity=detailed"

      - name: Preserve Program pipeline software measurements
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-program-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qualification/program-pipeline
          if-no-files-found: warn

      - name: Legacy authority recovery qualification
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~LegacyAuthorityCheckpointRecoveryTests" --logger "console;verbosity=detailed"

      - name: Output evidence and AUX routing qualification
        shell: pwsh
        run: |
          for ($iteration = 1; $iteration -le 2; $iteration++) {
            Write-Host "Output evidence and AUX routing qualification iteration $iteration"
            dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~DeterministicRuntimeBoundaryTests|FullyQualifiedName~RuntimeOutputBindingHealthTests|FullyQualifiedName~OutputRoleRuntimeFailureTests|FullyQualifiedName~ProductionIpcIntegrationTests.ShowTemplate_|FullyQualifiedName~ProductionIpcIntegrationTests.Operator_commands_" --logger "console;verbosity=detailed"
            if ($LASTEXITCODE -ne 0) { throw "Output evidence and AUX routing qualification failed in iteration $iteration." }
          }

      - name: AppHost readiness evidence and stage qualification
        run: dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build --filter "FullyQualifiedName~UnifiedApplicationHostTests" --logger "console;verbosity=detailed"

      - name: Operator startup evidence projection qualification
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~StartupLifecycleViewModelTests" --logger "console;verbosity=detailed"

      - name: Control runtime binding and readiness qualification
        env:
          RTAIME_BINDING_EVIDENCE_ROOT: ${{ github.workspace }}/artifacts/qualification/control-runtime-binding
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~ControlRuntimeBindingReadinessTests|FullyQualifiedName~ControlHostRecoveryIntegrationTests|FullyQualifiedName~ProductionIpcRecoveryTests|FullyQualifiedName~ExecutableHostLifecycleTests|FullyQualifiedName~ProcessSupervisionRecoveryTests" --logger "console;verbosity=detailed"

      - name: Repeat startup evidence capture qualification
        shell: pwsh
        env:
          RTAIME_BINDING_EVIDENCE_ROOT: ${{ github.workspace }}/artifacts/qualification/control-runtime-binding
        run: |
          foreach ($iteration in 1..2) {
            Write-Host "Startup evidence qualification iteration $iteration"
            dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter "FullyQualifiedName~StartupEvidenceCaptureTests|FullyQualifiedName~ProcessSupervisionRecoveryTests.AppHost_" --logger "console;verbosity=detailed"
            if ($LASTEXITCODE -ne 0) { throw "Startup evidence qualification failed in iteration $iteration." }
          }

      - name: Preserve Control runtime binding evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-control-runtime-binding-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qualification/control-runtime-binding
          if-no-files-found: warn

      - name: Qualify Windows application bootstrap
        shell: pwsh
        run: ./build/operations/Test-WindowsApplicationBootstrap.ps1 -Configuration Release -QualifySingleFile

      - name: Operator real XAML startup qualification
        shell: pwsh
        env:
          RTAIME_OPERATOR_VISUAL_EVIDENCE: ${{ github.workspace }}/artifacts/qualification/operator-visual
          RTAIME_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RTAIME_BASELINE_SDK: "10.0.401"
        run: |
          $diagnosticsPath = Join-Path $env:RUNNER_TEMP "operator-diagnostics"
          dotnet tool install dotnet-stack --tool-path $diagnosticsPath --version 10.0.750501
          if ($LASTEXITCODE -ne 0) { throw "Unable to install pinned STA diagnostic tool." }
          $env:RTAIME_STACK_TOOL = Join-Path $diagnosticsPath "dotnet-stack.exe"
          dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~OperatorXamlStartupTests|FullyQualifiedName~ProductionMacroOperatorTests|FullyQualifiedName~GpuDrawingSurfaceTests" --logger "console;verbosity=detailed"

      - name: Preserve combined Operator visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-operator-visual-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qualification/operator-visual
          if-no-files-found: warn

      - name: Operator UI regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build

      - name: Governed AI workflow regressions
        run: dotnet test rtaime.slnx --configuration Release --no-build -m:1 --filter "FullyQualifiedName~AIShowcase|FullyQualifiedName~AIEffectBrowser|FullyQualifiedName~AIResultUsePolicy|FullyQualifiedName~AIFailureIsolation|FullyQualifiedName~AIFallbackBehavior|FullyQualifiedName~GovernedAIContract"

      - name: Show template compatibility and authoring regressions
        run: dotnet test rtaime.slnx --configuration Release --no-build -m:1 --filter "FullyQualifiedName~ShowTemplate|FullyQualifiedName~ShowControlCoordinatorIntegrationTests.Template_"

      - name: Mixer interaction regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~AudioMixer"

      - name: Test
        run: dotnet test rtaime.slnx --configuration Release --no-build -m:1

      - name: Repeat process recovery qualification
        shell: pwsh
        run: |
          $tests = @(
            "FullyQualifiedName~ProcessSupervisionRecoveryTests.Killed_RuntimeHost_is_restarted_and_Control_reapplies_same_authority_revision",
            "FullyQualifiedName~ProcessSupervisionRecoveryTests.Killed_ControlHost_restores_durable_authority_while_Runtime_continues_and_stale_client_fails_closed",
            "FullyQualifiedName~ProductionIpcIntegrationTests.Serialized_operator_preview_takes_remain_authoritative_under_rapid_actions"
          )
          foreach ($iteration in 1..3) {
            foreach ($test in $tests) {
              Write-Host "Recovery qualification iteration ${iteration}: $test"
              dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build --filter $test
              if ($LASTEXITCODE -ne 0) {
                throw "Process recovery qualification failed in iteration $iteration for '$test'."
              }
            }
          }

      - name: Qualify V1 reference platform software profile
        shell: pwsh
        run: ./build/qualification/Invoke-ReferencePlatformQualification.ps1 -NoBuild

      - name: Preserve reference platform qualification status
        if: always()
        shell: pwsh
        run: |
          $evidence = "artifacts/qualification/reference-platform"
          if (-not (Test-Path -LiteralPath $evidence -PathType Container) -or
              -not (Get-ChildItem -LiteralPath $evidence -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1)) {
            New-Item -ItemType Directory -Path "artifacts/ci-diagnostics" -Force | Out-Null
            "UNVERIFIED: Reference platform qualification evidence was not produced. Inspect preceding CI steps; this is not a qualification PASS." |
              Set-Content -LiteralPath "artifacts/ci-diagnostics/reference-platform-not-run.txt"
          }

      - name: Upload reference platform qualification evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-reference-platform-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/qualification/reference-platform
            artifacts/ci-diagnostics/reference-platform-not-run.txt
          if-no-files-found: error

  quality:
    name: Quality
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Verify repository governance intent
        shell: pwsh
        run: ./build/governance/Test-RepositoryGovernance.ps1

      - name: Verify release channel policy
        shell: pwsh
        run: ./build/release/Test-ReleaseChannelPolicy.ps1

      - name: Verify offline bundle source paths
        shell: pwsh
        run: ./build/release/Test-OfflineBundleSourcePolicy.ps1

      - name: Verify update policy
        shell: pwsh
        run: ./build/update/Test-UpdatePolicy.ps1

      - name: Qualify unified versioning
        shell: pwsh
        run: ./build/release/Test-UnifiedVersioning.ps1

      - name: Verify persistent-state maintenance policy
        shell: pwsh
        run: ./build/state/Test-StateMaintenancePolicy.ps1

      - name: Verify coordinated upgrade policy
        shell: pwsh
        run: ./build/update/Test-CoordinatedUpgradePolicy.ps1

      - name: Verify managed host lifecycle policy
        shell: pwsh
        run: ./build/operations/Test-HostLifecyclePolicy.ps1

      - name: Verify application startup policy
        shell: pwsh
        run: ./build/operations/Test-ApplicationStartupPolicy.ps1

      - name: Verify Windows production lifecycle policy
        shell: pwsh
        run: ./build/operations/Test-WindowsServiceLifecyclePolicy.ps1

      - name: Verify secure external control policy
        shell: pwsh
        run: ./build/quality/Test-ExternalControlPolicy.ps1

      - name: Verify production integration gateway policy
        shell: pwsh
        run: ./build/quality/Test-ProductionIntegrationGatewayPolicy.ps1

      - name: Verify production macro policy
        shell: pwsh
        run: ./build/quality/Test-ProductionMacroPolicy.ps1

      - name: Verify replay and clip production policy
        shell: pwsh
        run: ./build/quality/Test-ReplayClipPolicy.ps1

      - name: Verify recording profile catalog policy
        shell: pwsh
        run: ./build/quality/Test-RecordingProfilePolicy.ps1

      - name: Verify operator UI policy
        shell: pwsh
        run: ./build/quality/Test-OperatorUiPolicy.ps1

      - name: Verify investor demo policy
        shell: pwsh
        run: ./build/showcase/Test-InvestorDemoPolicy.ps1

      - name: Verify operator monitoring policy
        shell: pwsh
        run: ./build/quality/Test-OperatorMonitoringPolicy.ps1

      - name: Verify observability diagnostics policy
        shell: pwsh
        run: ./build/quality/Test-ObservabilityPolicy.ps1

      - name: Verify Program frame memory ownership policy
        shell: pwsh
        run: ./build/quality/Test-ProgramFrameMemoryOwnershipPolicy.ps1

      - name: Verify GPU memory transfer policy
        shell: pwsh
        run: ./build/quality/Test-GpuMemoryTransferPolicy.ps1

      - name: Verify compositor optimization policy
        shell: pwsh
        run: ./build/quality/Test-CompositorOptimizationPolicy.ps1

      - name: Verify deterministic Runtime boundary policy
        shell: pwsh
        run: ./build/quality/Test-DeterministicRuntimeBoundaryPolicy.ps1

      - name: Verify CUDA qualification policy
        shell: pwsh
        run: ./build/quality/Test-CudaQualificationPolicy.ps1

      - name: Verify renderer qualification policy
        shell: pwsh
        run: ./build/quality/Test-RendererQualificationPolicy.ps1

      - name: Verify bounded soak qualification policy
        shell: pwsh
        run: ./build/quality/Test-SoakQualificationPolicy.ps1

      - name: Verify GPU lifecycle recovery policy
        shell: pwsh
        run: ./build/quality/Test-GpuLifecycleRecoveryPolicy.ps1

      - name: Verify sustained local media playback policy
        shell: pwsh
        run: ./build/quality/Test-LocalMediaPlaybackPolicy.ps1

      - name: Verify media I/O foundation policy
        shell: pwsh
        run: ./build/quality/Test-MediaIoFoundationPolicy.ps1

      - name: Verify media I/O vertical slice policy
        shell: pwsh
        run: ./build/quality/Test-MediaIoVerticalSlicePolicy.ps1

      - name: Verify network output and SRT policy
        shell: pwsh
        run: ./build/quality/Test-NetworkOutputPolicy.ps1

      - name: Verify NDI discovery and input policy
        shell: pwsh
        run: ./build/quality/Test-NdiDiscoveryInputPolicy.ps1

      - name: Verify advanced audio production policy
        shell: pwsh
        run: ./build/quality/Test-AdvancedAudioProductionPolicy.ps1

      - name: Verify timing reference latency and soak policy
        shell: pwsh
        run: ./build/quality/Test-TimingQualificationPolicy.ps1

      - name: Verify qualification evidence provenance policy
        shell: pwsh
        run: ./build/quality/Test-QualificationEvidenceBindingPolicy.ps1

      - name: Verify reference platform qualification policy
        shell: pwsh
        run: ./build/quality/Test-ReferencePlatformQualificationPolicy.ps1

      - name: Verify production support and Stable readiness policy
        shell: pwsh
        run: ./build/governance/Test-ProductionSupportReadinessPolicy.ps1

      - name: Restore
        run: dotnet restore rtaime.slnx

      - name: Build
        run: dotnet build rtaime.slnx --configuration Release --no-restore

      - name: Architecture tests
        run: dotnet test tests/rtaime.Tests.Architecture/rtaime.Tests.Architecture.csproj --configuration Release --no-build

      - name: Contract tests
        run: dotnet test tests/rtaime.Tests.Contracts/rtaime.Tests.Contracts.csproj --configuration Release --no-build

      - name: Unit tests
        run: dotnet test tests/rtaime.Tests.Unit/rtaime.Tests.Unit.csproj --configuration Release --no-build

      - name: Shortcut editor and strict profile regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~OperatorShortcutProfileTests|FullyQualifiedName~OperatorCommandPaletteTests|FullyQualifiedName~OperatorLibraryTests" --logger "console;verbosity=detailed"

      - name: Media smart query and batch isolation regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~MediaSmartSearchBatchTests|FullyQualifiedName~MediaLibraryBrowsingTests" --logger "console;verbosity=detailed"

      - name: Inspector typed transfer and local transaction regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~InspectorPrecisionTests|FullyQualifiedName~InspectorDraftTransactionTests|FullyQualifiedName~TimelineErgonomicsTests" --logger "console;verbosity=detailed"
      - name: Workspace presentation and portable template regressions
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~OperatorDockLayoutTests|FullyQualifiedName~WorkspacePresentationTemplateTests" --logger "console;verbosity=detailed"

      - name: Operator real XAML startup qualification
        shell: pwsh
        env:
          RTAIME_OPERATOR_VISUAL_EVIDENCE: ${{ github.workspace }}/artifacts/qualification/operator-visual
          RTAIME_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RTAIME_BASELINE_SDK: "10.0.401"
        run: |
          $diagnosticsPath = Join-Path $env:RUNNER_TEMP "operator-diagnostics"
          dotnet tool install dotnet-stack --tool-path $diagnosticsPath --version 10.0.750501
          if ($LASTEXITCODE -ne 0) { throw "Unable to install pinned STA diagnostic tool." }
          $env:RTAIME_STACK_TOOL = Join-Path $diagnosticsPath "dotnet-stack.exe"
          dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~OperatorXamlStartupTests|FullyQualifiedName~ProductionMacroOperatorTests|FullyQualifiedName~GpuDrawingSurfaceTests" --logger "console;verbosity=detailed"

      - name: Preserve combined Operator visual evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-operator-visual-${{ github.job }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/qualification/operator-visual
          if-no-files-found: warn

      - name: Operator startup tests
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~StartupLifecycleViewModelTests"

      - name: Operator visual and DPI qualification
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~OperatorVisualQualificationTests|FullyQualifiedName~OperatorCombinedVisualQualification|FullyQualifiedName~MonitoringVisualPerformanceQualificationTests"

      - name: Media viewport visual quality qualification
        run: dotnet test tests/rtaime.Tests.Operator/rtaime.Tests.Operator.csproj --configuration Release --no-build --filter "FullyQualifiedName~MediaViewportVisualQualityQualificationTests"

  security:
    name: Security
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Repository security governance
        shell: pwsh
        run: ./build/governance/Test-RepositorySecurity.ps1

      - name: Repository security exit-code regression
        shell: pwsh
        run: ./build/governance/Test-RepositorySecurityExitCodes.ps1

  provider-smoke:
    name: Provider Smoke
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore rtaime.slnx

      - name: Build provider and host graph
        run: dotnet build rtaime.slnx --configuration Release --no-restore

      - name: Build pinned native Media I/O provider
        shell: pwsh
        run: |
          $pin = Get-Content -LiteralPath ./native/Providers/AjaNtv2/libajantv2.version.json -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace([string]$pin.repository)) { throw "Pinned libajantv2 repository is missing." }
          if ([string]$pin.commit -notmatch '^[0-9a-f]{40}$') { throw "Pinned libajantv2 commit is invalid." }

          $sdkRoot = Join-Path $env:RUNNER_TEMP "rtaime-libajantv2"
          if (Test-Path -LiteralPath $sdkRoot) { Remove-Item -LiteralPath $sdkRoot -Recurse -Force }
          git clone --filter=blob:none ([string]$pin.repository) $sdkRoot
          if ($LASTEXITCODE -ne 0) { throw "Unable to clone pinned libajantv2 repository." }
          git -C $sdkRoot checkout --detach ([string]$pin.commit)
          if ($LASTEXITCODE -ne 0) { throw "Unable to checkout pinned libajantv2 commit." }
          $resolved = (git -C $sdkRoot rev-parse HEAD).Trim()
          if ($resolved -ne [string]$pin.commit) { throw "Resolved libajantv2 commit '$resolved' differs from pin '$($pin.commit)'." }

          ./build/native/Apply-AjaNtv2BuildCompatibility.ps1 `
            -SdkRoot $sdkRoot `
            -ExpectedCommit $resolved

          $nativeBuild = Join-Path $PWD "artifacts/native-provider-smoke"
          cmake -S native/Providers/AjaNtv2 -B $nativeBuild -A x64 `
            -DAJA_NTV2_ROOT="$sdkRoot" `
            -DRTAIME_AJA_SDK_REVISION="$resolved"
          if ($LASTEXITCODE -ne 0) { throw "Native Media I/O configure failed." }
          cmake --build $nativeBuild --config Release
          if ($LASTEXITCODE -ne 0) { throw "Native Media I/O build failed." }

          $dlls = @(Get-ChildItem -LiteralPath $nativeBuild -Filter rtaime_media_io.dll -File -Recurse)
          if ($dlls.Count -ne 1) { throw "Expected exactly one rtaime_media_io.dll, found $($dlls.Count)." }
          Write-Host "Native Media I/O provider compile PASS: $($dlls[0].FullName)"
          Write-Host "libajantv2 commit: $resolved"

      - name: Provider integration smoke
        run: dotnet test tests/rtaime.Tests.Integration/rtaime.Tests.Integration.csproj --configuration Release --no-build

  packaged-e2e:
    name: Packaged E2E
    runs-on: windows-latest
    timeout-minutes: 70
    needs:
      - ci
      - quality
      - security
      - provider-smoke
    # Preserve independent packaged qualification after CI or Quality failure.
    # Both checks remain mandatory in readiness; test packaging cannot authorize release.
    if: ${{ !cancelled() && needs.security.result == 'success' && needs['provider-smoke'].result == 'success' }}

    steps:
      - name: Checkout exact source candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Run authoritative release pipeline qualification
        shell: pwsh
        env:
          RTAIME_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RTAIME_BUILD_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RTAIME_BUILD_ID: packaged-e2e-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          ./build/release/Invoke-ReleasePipeline.ps1 `
            -Channel QUALIFICATION `
            -SignerClass TEST_EPHEMERAL `
            -SignerId "github-actions-packaged-e2e"

      - name: Qualify update replacement and rollback foundation
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath ./artifacts/release-pipeline -Filter *.zip -File -Recurse)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one qualification bundle, found $($bundles.Count)."
          }
          ./build/update/Test-UpdateFoundation.ps1 -BundlePath $bundles[0].FullName

      - name: Qualify coordinated upgrade packaging
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath ./artifacts/release-pipeline -Filter *.zip -File -Recurse)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one qualification bundle, found $($bundles.Count)."
          }
          ./build/update/Test-CoordinatedUpgradePackaging.ps1 -BundlePath $bundles[0].FullName

      - name: Qualify coordinated state upgrade and recovery
        shell: pwsh
        env:
          RTAIME_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $bundles = @(Get-ChildItem -LiteralPath ./artifacts/release-pipeline -Filter *.zip -File -Recurse)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one qualification bundle, found $($bundles.Count)."
          }
          ./build/update/Test-CoordinatedStateUpgradeQualification.ps1 -BundlePath $bundles[0].FullName

      - name: Qualify managed host lifecycle and restart
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath ./artifacts/release-pipeline -Filter *.zip -File -Recurse)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one qualification bundle, found $($bundles.Count)."
          }
          ./build/operations/Test-ManagedHostLifecycle.ps1 -BundlePath $bundles[0].FullName
          ./build/operations/Test-ManagedHostLifecycle.ps1 -BundlePath $bundles[0].FullName -LegacyAuthorityCheckpointPath ./tests/rtaime.Tests.Integration/TestData/LegacyAuthorityV1.json -LegacyShowProjectPath ./tests/rtaime.Tests.Integration/TestData/LegacyShowProjectV1.json

      - name: Qualify packaged investor demo bootstrap
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -LiteralPath ./artifacts/release-pipeline -Filter *.zip -File -Recurse)
          if ($bundles.Count -ne 1) {
            throw "Expected exactly one qualification bundle, found $($bundles.Count)."
          }
          ./build/showcase/Test-PackagedInvestorDemo.ps1 -BundlePath $bundles[0].FullName

      - name: Upload packaged E2E evidence
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-packaged-e2e-${{ github.run_id }}
          path: |
            artifacts/release-pipeline
            artifacts/release-evidence
          if-no-files-found: error

  release-readiness-index:
    name: Release readiness evidence index
    if: ${{ always() }}
    needs: [ci, quality, security, provider-smoke, packaged-e2e]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout exact assessed source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Retain current run and latest job evidence
        id: gate-evidence
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $run = Invoke-RestMethod -Uri $api -Headers $headers
          $jobs = @(); $page = 1
          do {
            $response = Invoke-RestMethod -Uri "$api/jobs?filter=latest&per_page=100&page=$page" -Headers $headers
            $jobs += @($response.jobs); $page++
          } while (@($response.jobs).Count -eq 100)
          New-Item -ItemType Directory -Path artifacts/readiness -Force | Out-Null
          @{ repository = $env:GITHUB_REPOSITORY; selection = "latest"; run = $run; jobs = $jobs } |
            ConvertTo-Json -Depth 64 | Set-Content -LiteralPath artifacts/readiness/required-gates.json -Encoding utf8
      - name: Collect packaged evidence
        if: ${{ needs.packaged-e2e.result == 'success' }}
        uses: actions/download-artifact@v6
        with:
          name: rtaime-packaged-e2e-${{ github.run_id }}
          path: artifacts/readiness/packaged
      - name: Select retained mixed-load artifact by run and source
        if: ${{ needs.ci.result == 'success' }}
        id: mixed-artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RTAIME_ASSESSED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json"; "X-GitHub-Api-Version" = "2022-11-28" }
          $api = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts"
          $artifacts = @(); $page = 1
          do {
            $response = Invoke-RestMethod -Uri "$($api)?per_page=100&page=$page" -Headers $headers
            $artifacts += @($response.artifacts); $page++
          } while (@($response.artifacts).Count -eq 100)
          $catalogPath = "artifacts/readiness/workflow-artifacts.json"
          @{ artifacts = $artifacts } | ConvertTo-Json -Depth 64 | Set-Content -LiteralPath $catalogPath -Encoding utf8
          $selected = ./build/release/Select-MixedLoadArtifact.ps1 -CatalogPath $catalogPath -RunId $env:GITHUB_RUN_ID -MaximumRunAttempt $env:GITHUB_RUN_ATTEMPT -ExpectedSourceCommit $env:RTAIME_ASSESSED_SOURCE
          "name=$($selected.name)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          $selected | ConvertTo-Json | Set-Content -LiteralPath artifacts/readiness/selected-mixed-artifact.json -Encoding utf8
      - name: Collect short staged software evidence
        if: ${{ needs.ci.result == 'success' }}
        uses: actions/download-artifact@v6
        with:
          name: ${{ steps.mixed-artifact.outputs.name }}
          path: artifacts/readiness/mixed
      - name: Assess exact-source evidence and operational handoff
        shell: pwsh
        env:
          RTAIME_ASSESSED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $indexParams = @{
            ExpectedSourceCommit = $env:RTAIME_ASSESSED_SOURCE
            RequiredGatesPath = "artifacts/readiness/required-gates.json"
            OutputPath = "artifacts/readiness/release-readiness-index.json"
          }
          if (Test-Path -LiteralPath artifacts/readiness/packaged) {
            $evidence = @(Get-ChildItem -LiteralPath artifacts/readiness/packaged -Filter release-evidence.json -File -Recurse)
            $candidate = @(Get-ChildItem -LiteralPath artifacts/readiness/packaged -Filter release-candidate.json -File -Recurse)
            $upgrade = @(Get-ChildItem -LiteralPath artifacts/readiness/packaged -Filter coordinated-state-upgrade-qualification.json -File -Recurse)
            if ($evidence.Count -ne 1 -or $candidate.Count -ne 1 -or $upgrade.Count -ne 1) { throw "Packaged evidence inventory is ambiguous or incomplete." }
            $indexParams.ReleaseEvidencePath = $evidence[0].DirectoryName
            $indexParams.QualificationCandidatePath = $candidate[0].DirectoryName
            $indexParams.CoordinatedUpgradeQualificationPath = $upgrade[0].FullName
          }
          if (Test-Path -LiteralPath artifacts/readiness/mixed) {
            $summaries = @(Get-ChildItem -LiteralPath artifacts/readiness/mixed -Filter summary.json -File -Recurse)
            if ($summaries.Count -ne 1) { throw "Short staged evidence inventory is ambiguous or incomplete." }
            $indexParams.MixedLoadEvidencePaths = @($summaries[0].FullName)
          }
          $result = ./build/release/New-ReleaseReadinessIndex.ps1 @indexParams
          if ($result.overallStatus -eq "FAIL") { throw "Release readiness evidence has a failed domain. See retained index." }
      - name: Preserve release readiness index and inputs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rtaime-release-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/readiness
          if-no-files-found: error
