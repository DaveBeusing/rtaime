name: Bootstrap validation

on:
  push:
    branches:
      - master
      - bootstrap-solution-architecture
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  managed-validation:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Qualify SDK
        shell: pwsh
        run: |
          dotnet --info
          dotnet --list-sdks
          dotnet new --list
          if ((dotnet --version) -ne "10.0.401") {
            throw "Expected .NET SDK 10.0.401."
          }

      - name: Restore
        run: dotnet restore rtaime.slnx

      - name: Build
        run: dotnet build rtaime.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test rtaime.slnx --configuration Release --no-build

      - name: Generate release evidence
        shell: pwsh
        env:
          RTAIME_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          RTAIME_BUILD_COMMIT: ${{ github.sha }}
          RTAIME_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: ./build/release/New-ReleaseEvidence.ps1 -ManagedValidationStatus PASS

      - name: Verify release evidence
        shell: pwsh
        run: ./build/release/Test-ReleaseEvidence.ps1

      - name: Qualify release signing, packaging and offline deployment
        shell: pwsh
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP "rtaime-release-test-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT.pem"
          $installPath = Join-Path $env:RUNNER_TEMP "rtaime-offline-install-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          try {
            ./build/release/New-TestReleaseSigningKey.ps1 -PrivateKeyPath $keyPath
            ./build/release/New-ReleaseAttestation.ps1 `
              -PrivateKeyPath $keyPath `
              -SignerClass TEST_EPHEMERAL `
              -SignerId "github-actions"
            ./build/release/Test-ReleaseAttestation.ps1
            ./build/release/Test-ReleaseSigningFailureCases.ps1

            ./build/release/New-OfflineReleaseBundle.ps1 `
              -PrivateKeyPath $keyPath `
              -SignerClass TEST_EPHEMERAL `
              -SignerId "github-actions"

            $bundleDirectories = @(Get-ChildItem -LiteralPath ./artifacts/offline-release -Directory)
            $bundleArchives = @(Get-ChildItem -LiteralPath ./artifacts/offline-release -Filter *.zip -File)
            if ($bundleDirectories.Count -ne 1) {
              throw "Expected exactly one generated offline bundle directory."
            }
            if ($bundleArchives.Count -ne 1) {
              throw "Expected exactly one generated offline bundle ZIP."
            }

            ./build/release/Test-OfflineReleaseBundle.ps1 -BundlePath $bundleArchives[0].FullName
            ./build/release/Invoke-OfflinePreflight.ps1 `
              -BundlePath $bundleArchives[0].FullName `
              -InstallPath $installPath
            ./build/release/Test-OfflineReleaseFailureCases.ps1 `
              -BundleDirectory $bundleDirectories[0].FullName `
              -ArchivePath $bundleArchives[0].FullName
            ./build/release/Install-OfflineRelease.ps1 `
              -BundlePath $bundleArchives[0].FullName `
              -InstallPath $installPath
            & (Join-Path $installPath "tools/Test-OfflineReleaseBundle.ps1") -BundlePath $installPath
          }
          finally {
            if (Test-Path -LiteralPath $keyPath) {
              Remove-Item -LiteralPath $keyPath -Force
            }
            if (Test-Path -LiteralPath $installPath) {
              Remove-Item -LiteralPath $installPath -Recurse -Force
            }
          }

      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: rtaime-release-evidence-${{ github.run_id }}
          path: artifacts/release-evidence
          if-no-files-found: error

      - name: Upload offline release bundle
        uses: actions/upload-artifact@v4
        with:
          name: rtaime-offline-release-${{ github.run_id }}
          path: |
            artifacts/offline-release/*.zip
            artifacts/offline-release/*.zip.sha256
          if-no-files-found: error
